# mosaic-wallpaper configuration.
# Copy to  $XDG_CONFIG_HOME/mosaic-wallpaper/config.ini  (usually ~/.config/mosaic-wallpaper/config.ini)
# — the installer does this for you. Every value below is optional; these are the built-in defaults.

[source]
# Where to draw wallpaper images from. One or more directories, separated by newlines or commas.
# ~ is expanded. Directories are scanned for the extensions below.
directories = ~/Pictures

# Which files count as images.
extensions = jpg jpeg png webp bmp gif

# Scan sub-directories too? (folders named "thumbnails" / ".thumbnails" are always skipped)
recursive = true

# Rebuild the cached image list when it's older than this (hours). Picks up newly-added images.
index_max_age_hours = 24

[filter]
# Skip images that would make poor wallpapers (icons, banners, spacers, tiny thumbnails).
min_long_edge = 700     # longest side must be at least this many pixels
min_bytes     = 15000   # files smaller than this are almost always icons/spacers
min_aspect    = 0.20    # width / height — lower bound (0.20 keeps tall webtoon/strip images)
max_aspect    = 3.5     # width / height — upper bound (rejects thin banners)

[compose]
# How each monitor's image is fitted to its screen:
#   fill    = cover the whole monitor, cropping the overflow   (recommended, no borders)
#   fit     = show the whole image, letterboxed on the background colour
#   stretch = distort the image to exactly fill the monitor
mode = fill

# Background colour behind "fit" letterboxing (and GNOME's primary colour). Hex.
background = #000000

# Quality of the composed JPEG canvas (1-95).
jpeg_quality = 90

[wallpaper]
# Which backend sets the wallpaper. "auto" detects it:
#   gnome       -> gsettings, spanned across monitors (GNOME / Unity / Cinnamon; X11 or Wayland)
#   sway        -> per-output backgrounds (sway / wlroots)
#   feh         -> X11 root window (KDE-X11, XFCE, i3, …)
#   xwallpaper  -> X11 root window (alternative to feh)
# Set explicitly to override auto-detection.
backend = auto
